name: New provisional adapter and closed reconstruction only
on:
  push:
    branches: [qa/cheveni-technical-adapter-lab-20261022]
    paths: ['qa/technical-closure-20261022/**', '.github/workflows/technical-adapter-new-20261022.yml']
permissions:
  contents: read
jobs:
  pg17-tls-rebuild:
    if: github.repository == 'MarcoAlexis10/chebot-web' && !contains(github.event.head_commit.message, '[windows-only]') && !contains(github.event.head_commit.message, '[delta-only]') && !contains(github.event.head_commit.message, '[fault-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only immutable image download
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: New real TLS capture and closed reconstruction only
        run: node qa/technical-closure-20261022/qa/adapter-pg17-new.mjs
      - name: Independent cleanup verification
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs';
          assertNoResources();console.log('INDEPENDENT_NEW_ADAPTER_CLEANUP_OK');
          JS
  windows-ntfs-new-adapter:
    if: github.repository == 'MarcoAlexis10/chebot-web' && !contains(github.event.head_commit.message, '[linux-only]') && !contains(github.event.head_commit.message, '[delta-only]') && !contains(github.event.head_commit.message, '[fault-only]')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: New process and actual NTFS isolation checks only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --test qa/technical-closure-20261022/adapter-focused.test.mjs
          if($LASTEXITCODE -ne 0){throw 'NEW_WINDOWS_ADAPTER_FAILED'}
          Write-Output 'ACTUAL_WINDOWS_NTFS_AND_PROCESS_CHECKS_PASS__NO_DOCKER_DESKTOP_TLS_CLAIM'
  a2-reconstruction-delta:
    if: github.repository == 'MarcoAlexis10/chebot-web' && contains(github.event.head_commit.message, '[delta-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only immutable PG image
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: New installation and reconstruction differences only
        run: node qa/technical-closure-20261022/qa/a2-reconstruction-delta.mjs
      - name: Independent cleanup
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs';
          assertNoResources();console.log('INDEPENDENT_A2_DELTA_CLEANUP_OK');
          JS
  windows-new-lifecycle-fix:
    if: github.repository == 'MarcoAlexis10/chebot-web' && contains(github.event.head_commit.message, '[delta-only]')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Only new closed-stdout cancellation regression and affected normal publication
        shell: powershell
        run: |
          node --test qa/technical-closure-20261022/process-lifecycle-focused.test.mjs
          if($LASTEXITCODE -ne 0){throw 'NEW_LIFECYCLE_FIX_FAILED'}
  linux-rebuild-failure-new:
    if: github.repository == 'MarcoAlexis10/chebot-web' && contains(github.event.head_commit.message, '[fault-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only image
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: Only new reconstruction failure and affected TLS capture
        run: node qa/technical-closure-20261022/qa/rebuild-failure-new.mjs
      - name: Cross-platform Desktop bridge after new in-container certificate setup
        run: |
          node --input-type=module <<'JS'
          import {desktopFocusedLab} from './qa/technical-closure-20261022/desktop-lab.mjs';
          console.log(JSON.stringify(await desktopFocusedLab()));
          JS
      - name: Independent cleanup
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs';
          assertNoResources();console.log('INDEPENDENT_REBUILD_FAULT_CLEANUP_OK');
          JS
  windows-flat-package-new:
    if: github.repository == 'MarcoAlexis10/chebot-web' && contains(github.event.head_commit.message, '[fault-only]')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Build new flat package and run signed-node launcher without Docker operations
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'Che Veni NEW adapter only'
          $zip=Join-Path $env:RUNNER_TEMP 'CheVeni-NewAdapter-Only.zip'
          python qa/technical-closure-20261022/build-desktop-package.py "$p" "$zip"
          if($LASTEXITCODE -ne 0){throw 'NEW_PACKAGE_BUILD_FAILED'}
          $env:CHEVENI_NEW_ADAPTER_DIAGNOSTIC='1'
          $env:CHEVENI_PACKAGE_NO_PAUSE='1'
          $output=(& "$p/00-LABORATORIO-NUEVO-FICTICIO.cmd" | Out-String)
          if($LASTEXITCODE -ne 0){throw 'NEW_WINDOWS_LAUNCHER_FAILED'}
          $r=$output|ConvertFrom-Json
          if($r.result -ne 'NEW_WINDOWS_PACKAGE_DIAGNOSTIC_PASS' -or $r.manifestFiles -ne 17 -or $r.remoteConnectionEnabled -or $r.dockerContacted){throw 'NEW_PACKAGE_DIAGNOSTIC_INVALID'}
          Write-Output 'NEW_FLAT_WINDOWS_MANIFEST_17_OF_17_SIGNED_NODE_LAUNCHER_PASS'
          Get-FileHash -LiteralPath $zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash
      - name: Remove only new package fixture
        if: always()
        shell: powershell
        run: |
          foreach($name in @('Che Veni NEW adapter only','CheVeni-NewAdapter-Only.zip')){
            $p=Join-Path $env:RUNNER_TEMP $name
            if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Recurse -Force}
          }
          Write-Output 'NEW_WINDOWS_PACKAGE_TEST_CLEANUP_OK'
