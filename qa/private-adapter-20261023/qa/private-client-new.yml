name: Private provisional client and closed business recovery NEW only
on:
  push:
    branches: [qa/cheveni-private-client-lab-20261023]
    paths: ['qa/private-adapter-20261023/**', '.github/workflows/private-client-new-20261023.yml']
permissions:
  contents: read
jobs:
  new-private-pg17:
    if: github.repository == 'MarcoAlexis10/chebot-web' && !contains(github.event.head_commit.message, '[a2-abort-only]') && !contains(github.event.head_commit.message, '[client-fault-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only cached immutable image preparation
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: Only new real libpq PGPASSFILE transport and business quarantine
        run: node qa/private-adapter-20261023/qa/private-pg17-new.mjs
      - name: Independent cleanup verification
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs';
          import {assertNoPrivateClients} from './qa/private-adapter-20261023/private-source.mjs';
          assertNoPrivateClients();assertNoResources();
          console.log('INDEPENDENT_PRIVATE_ADAPTER_NEW_CLEANUP_OK');
          JS
  a2-new-precommit-abort:
    if: github.repository == 'MarcoAlexis10/chebot-web' && contains(github.event.head_commit.message, '[a2-abort-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only immutable image
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: Only NEW failure before COMMIT; no previous A2 suites
        run: node qa/private-adapter-20261023/qa/a2-abort-new.mjs
      - name: Independent new abort cleanup
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs';
          assertNoResources();console.log('INDEPENDENT_A2_PRECOMMIT_ABORT_CLEANUP_OK');
          JS
  new-client-cancel-faults:
    if: github.repository == 'MarcoAlexis10/chebot-web' && contains(github.event.head_commit.message, '[client-fault-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only immutable image
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: Only NEW active-client cancellation and pre-stdin failure
        run: node qa/private-adapter-20261023/qa/client-cancel-new.mjs
      - name: Independent new client-fault cleanup
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs';
          import {assertNoPrivateClients} from './qa/private-adapter-20261023/private-source.mjs';
          assertNoResources();assertNoPrivateClients();console.log('INDEPENDENT_NEW_CLIENT_FAULT_CLEANUP_OK');
          JS
