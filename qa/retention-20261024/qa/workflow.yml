name: D02-A retention NEW fictional cases only
on:
  push:
    branches: [qa/cheveni-d02a-retention-lab-20261024]
    paths: ['qa/retention-20261024/**', '.github/workflows/d02a-retention-new-20261024.yml']
permissions:
  contents: read
jobs:
  new-retention-only:
    if: github.repository == 'MarcoAlexis10/chebot-web' && github.event.repository.private == false && !contains(github.event.head_commit.message, '[evidence-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only pinned fictional image
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: Only new D02-A retention cases
        env:
          RET_QA_FROM: '30'
        run: node qa/retention-20261024/qa/retention-postgres-new.mjs
      - name: Independent cleanup check
        if: always()
        run: node --input-type=module -e "import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs';assertNoResources();console.log('RETENTION_NEW_RESOURCES_EMPTY');"
# No old test imports/runs, real DSN, npm, secrets, capture, providers or deploys.
