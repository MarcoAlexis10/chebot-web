name: Contract 13 new fictional PostgreSQL QA only
on:
  push:
    branches: [qa/cheveni-legal-acceptance-transaction-20261024]
    paths: ['qa/legal-acceptance-20261024/**', '.github/workflows/legal-acceptance-20261024.yml']
permissions:
  contents: read
jobs:
  contract-13-new-integration:
    if: ${{ !contains(github.event.head_commit.message, '[legacy-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only immutable fictional image
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: Only new contract 13 cases
        run: node qa/legal-acceptance-20261024/qa/acceptance-postgres.mjs
      - name: Independent cleanup check
        if: always()
        run: node --input-type=module -e "import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs'; assertNoResources(); console.log('LEGAL_CONTRACT_13_RESOURCES_EMPTY');"
# No secrets, npm, private sources, remote database, ZIP, capture or deployment.
  contract-13-legacy-closure-new-only:
    if: ${{ contains(github.event.head_commit.message, '[legacy-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: CI-only immutable fictional image
        run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      - name: Only new legacy closure cases
        run: node qa/legal-acceptance-20261024/qa/legacy-closure-postgres.mjs
      - name: Independent cleanup check
        if: always()
        run: node --input-type=module -e "import {assertNoResources} from './qa/technical-closure-20261022/qa/pg-fixture.mjs'; assertNoResources(); console.log('LEGAL_LEGACY_RESOURCES_EMPTY');"
