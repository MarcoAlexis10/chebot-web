name: Concierge Manager Preview - build-only QA

on:
  push:
    branches: [concierge-manager-web-v1, qa/cheveni-web-local-review-20261018]
    paths: ["*.js", "*.cjs", "package.json", "test/**", ".github/workflows/concierge-manager-preview-build-only.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager-preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Public, deliberately fake build-only values; no Vercel and no Auth calls.
      MANAGER_API_ORIGIN: https://fictional-api.example.invalid
      MANAGER_WEB_ORIGIN: https://fictional-manager.example.invalid
      SUPABASE_URL: https://tyvwgsdzqipusodxtydv.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_FICTIONAL_LOCAL_ONLY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build Manager Preview locally (NO DEPLOY)
        run: npm run build
      - name: Assert recovery, expired stays and JS build
        run: node --test
